<body>
  <div id="root"></div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      alert('Error: ' + message + '\nSource: ' + source + '\nLine: ' + lineno);

      alert('Unhandled Rejection: ' + event.reason);
    });
  </script>
